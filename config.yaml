# ============================================================
#  La Rassegna — impostazioni avanzate
#  Per scegliere argomenti, giorni e ora NON serve toccare
#  questo file: usa Actions → Configura la rassegna su GitHub.
#  Qui si cambiano solo fonti e dettagli dell'impaginazione.
# ============================================================

testata: "La Rassegna"

# Quante ore indietro guardare (26 = l'ultimo giorno, con un po' di margine)
ore_indietro: 26

# Quante notizie mostrare
max_prima_pagina: 4
max_per_argomento: 5
max_in_breve: 8

# Cerca la foto nella pagina dell'articolo se il feed non la fornisce
cerca_immagini_nelle_pagine: true

# "Accadde oggi" da Wikipedia
accadde_oggi: true

# ------------------------------------------------------------
#  Argomenti tra cui scegliere, nell'ordine in cui compaiono
#  nell'email. Le notizie dei feed tematici (es. ANSA Sport)
#  restano nel loro argomento; quelle dei feed generali vanno
#  nell'argomento con più parole chiave trovate (quelle nel
#  titolo contano di più; a parità vince il primo in elenco).
#  Parole corte (fino a 4 lettere) contano solo come parola
#  intera; quelle più lunghe anche come inizio di parola
#  (es. "arrestat" trova arrestato, arrestati, arrestata).
# ------------------------------------------------------------
catalogo_argomenti:
  - id: politica
    nome: "Politica"
    parole_chiave: [governo, meloni, parlamento, senato, "camera dei deputati", ministr, decreto, elezioni, mattarella, schlein, quirinale, "legge di bilancio", manovra, opposizione, premier]
  - id: esteri
    nome: "Esteri"
    parole_chiave: [guerra, ucraina, russia, israel, gaza, cisgiordania, netanyahu, hamas, libano, siria, farnesina, iran, nato, cina, "stati uniti", trump, putin, zelensky, onu, "unione europea", ue, bruxelles, terroris, intelligence, spionaggio, "medio oriente"]
  - id: economia
    nome: "Economia e lavoro"
    parole_chiave: [economia, inflazione, mercati, borsa, spread, pil, bce, "tassi di interesse", lavoro, occupazione, sindacat, imprese, bollette, pensioni, fisco, tasse]
  - id: tecnologia
    nome: "Tecnologia e sicurezza informatica"
    parole_chiave: [tecnologi, "intelligenza artificiale", ia, hacker, cyber, ransomware, malware, phishing, informatic, smartphone, app, apple, google, microsoft, openai, chip, digitale, startup]
  - id: scienza
    nome: "Scienza e salute"
    parole_chiave: [scienz, ricercatori, scoperta, spazio, nasa, esa, salute, medic, malattia, vaccin, ospedal, clima]
  - id: cultura
    nome: "Cultura e spettacoli"
    parole_chiave: [cultura, libro, libri, mostra, museo, cinema, film, festival, musica, concerto, teatro, arte, "serie tv"]
  - id: sport
    nome: "Sport"
    parole_chiave: [calcio, "serie a", campionato, gol, tennis, sinner, "formula 1", motogp, olimpiad, juventus]
  - id: cronaca
    nome: "Cronaca"
    parole_chiave: [arrestat, omicidio, incidente, polizia, carabinieri, indagin, procura, tribunale, processo, maltempo, alluvione, terremoto, incendio]

# ------------------------------------------------------------
#  Fonti (feed RSS italiani).
#  argomento = argomento del feed; "generale" se il feed parla
#              di tutto (decidono le parole chiave)
#  scheda    = la nota in piccolo accanto alla fonte. Sono
#              descrizioni INDICATIVE: verificale e correggile.
#  priorita  = a parità di copertura, un numero più basso
#              ha precedenza.
# ------------------------------------------------------------
fonti:
