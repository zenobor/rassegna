  - {nome: "ANSA Politica", url: "https://www.ansa.it/sito/notizie/politica/politica_rss.xml", argomento: politica, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Mondo", url: "https://www.ansa.it/sito/notizie/mondo/mondo_rss.xml", argomento: esteri, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Economia", url: "https://www.ansa.it/sito/notizie/economia/economia_rss.xml", argomento: economia, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Cronaca", url: "https://www.ansa.it/sito/notizie/cronaca/cronaca_rss.xml", argomento: cronaca, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Tecnologia", url: "https://www.ansa.it/canale_tecnologia/notizie/tecnologia_rss.xml", argomento: tecnologia, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Scienza", url: "https://www.ansa.it/canale_scienza_tecnica/notizie/scienzaetecnica_rss.xml", argomento: scienza, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Salute", url: "https://www.ansa.it/canale_saluteebenessere/notizie/saluteebenessere_rss.xml", argomento: scienza, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Cultura", url: "https://www.ansa.it/sito/notizie/cultura/cultura_rss.xml", argomento: cultura, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}
  - {nome: "ANSA Sport", url: "https://www.ansa.it/sito/notizie/sport/sport_rss.xml", argomento: sport, priorita: 1, scheda: "Agenzia di stampa, cooperativa di editori"}

  # Servizio pubblico
