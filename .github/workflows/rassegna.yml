name: Personal Digest Mail

on:
  schedule:
    # Le due ore UTC corrispondono alle 06:45 in Europe/Rome, estate e inverno.
    - cron: "45 4 * * 1-5"
    - cron: "45 5 * * 1-5"
  workflow_dispatch:   # pulsante "Run workflow" per provarla quando vuoi

permissions:
  contents: read

jobs:
  rassegna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Controlla le credenziali email
        id: email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Email non configurata. Aggiungi SMTP_USER e SMTP_PASSWORD nei Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crea e invia la rassegna
        if: steps.email.outputs.configured == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -z "$SMTP_HOST" ]; then unset SMTP_HOST; fi
          if [ -z "$SMTP_PORT" ]; then unset SMTP_PORT; fi
          if [ -z "$MAIL_TO" ]; then unset MAIL_TO; fi
          if [ -z "$DEEPL_API_KEY" ]; then unset DEEPL_API_KEY; fi
          python rassegna.py --anteprima rassegna.html --invia

      - name: Salva una copia dell'HTML
        if: always() && steps.email.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rassegna-${{ github.run_number }}
          path: rassegna.html
          retention-days: 7
          if-no-files-found: ignore
