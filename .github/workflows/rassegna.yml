name: Invia la rassegna

on:
  schedule:
    # Una partenza alle :55 di ogni ora utile (orari italiani dalle 05:00 alle 22:00,
    # con ora legale e solare). Il programma invia solo nell'ora e nei giorni scelti
    # in preferenze.yaml: non serve modificare queste righe.
    - cron: "55 2 * * *"
    - cron: "55 3 * * *"
    - cron: "55 4 * * *"
    - cron: "55 5 * * *"
    - cron: "55 6 * * *"
    - cron: "55 7 * * *"
    - cron: "55 8 * * *"
    - cron: "55 9 * * *"
    - cron: "55 10 * * *"
    - cron: "55 11 * * *"
    - cron: "55 12 * * *"
    - cron: "55 13 * * *"
    - cron: "55 14 * * *"
    - cron: "55 15 * * *"
    - cron: "55 16 * * *"
    - cron: "55 17 * * *"
    - cron: "55 18 * * *"
    - cron: "55 19 * * *"
    - cron: "55 20 * * *"
  workflow_dispatch:   # pulsante "Run workflow": invia subito una rassegna di prova

permissions:
  contents: read

jobs:
  rassegna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Crea e invia la rassegna
        env:
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python rassegna.py --anteprima rassegna.html --invia

      - name: Salva una copia dell'email
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rassegna-${{ github.run_number }}
          path: rassegna.html
          retention-days: 7
          if-no-files-found: ignore
